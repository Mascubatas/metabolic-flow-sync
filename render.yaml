services:
  - type: web
    name: metabolic-flow-sync
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false